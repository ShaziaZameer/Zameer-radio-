name: Verify mood queues and build Android 4.6
on:
  push:
    branches: [fix/mood-queue-navigation-45]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: source46
    steps:
      - uses: actions/checkout@v4
      - name: Extract approved versioned source
        working-directory: .
        run: |
          sha256sum -c source-4.6.sha256
          unzip -q source-4.6.zip -d source46
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Core and native regression checks
        run: |
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/now-playing.js
          node tests/mood45-core.cjs
          node tests/mahfil44-core.cjs
          node tests/poetry46-core.cjs
          mkdir -p /tmp/native45
          javac -d /tmp/native45 app/src/main/java/com/zameer/radio/RadioMatch.java app/src/main/java/com/zameer/radio/RadioQueueHistory.java tests/RadioMood45Test.java
          java -cp /tmp/native45 com.zameer.radio.RadioMood45Test
      - name: Live stream checks
        run: |
          if ! command -v ffprobe >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
          python tests/check46-poems.py
      - name: Browser checks
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
          node tests/poetry46-ui.cjs
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build release and lint
        run: gradle :app:assembleRelease :app:bundleRelease :app:lintRelease --no-daemon
      - name: Collect signing verifier
        run: cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" qa/4.6/apksigner.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zameer-radio-46-verification
          path: |
            source46/qa/4.6/
            source46/app/build/reports/lint-results-release.*
      - uses: actions/upload-artifact@v4
        with:
          name: zameer-radio-46-unsigned
          path: |
            source46/app/build/outputs/apk/release/*.apk
            source46/app/build/outputs/bundle/release/*.aab
